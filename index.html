<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Family Tree</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fbfd;
            margin: 0;
            overflow: hidden;
        }
        .node circle {
            fill: #fff;
            stroke: #4b6cb7;
            stroke-width: 3px;
            cursor: pointer;
        }
        .node text {
            font-size: 13px;
            fill: #333;
        }
        .node .spouse-text {
            fill: #666;
            font-style: italic;
            font-size: 11px;
        }
        .link {
            fill: none;
            stroke: #bcccda;
            stroke-width: 2px;
        }
        #tree-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="tree-container"></div>

    <!-- Local repository script link to bypass security barriers -->
    <script src="d3.v7.min.js"></script>
<script src="./node_modules/d3/dist/d3.min.js" onerror="this.src='https://cloudflare.com'"></script>
    <script>
        // 1. Dimensions and Map Configuration
        const margin = {top: 40, right: 90, bottom: 50, left: 150};
        const width = window.innerWidth - margin.left - margin.right;
        const height = window.innerHeight - margin.top - margin.bottom;

        // 2. Append SVG and apply Zoom/Pan behavior
        const svg = d3.select("#tree-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        // This main group holds the tree layout
        const g = svg.append("g");
        
        // 3. Initialize Tree Layout Creator
        const treemap = d3.tree().nodeSize(); 

        let root;

        // 4. Helper function to handle collapsing nodes (Restored!)
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        // 5. Fetch and load data
        d3.json("data.json").then(data => {
            root = d3.hierarchy(data, d => d.children);
            
            const initialLeft = window.innerWidth > 600 ? 150 : 50;
            const initialTop = window.innerHeight / 2;
            
            g.attr("transform", `translate(${initialLeft}, ${initialTop})`);

            root.x0 = 0;
            root.y0 = 0;

            const savedCollapsed = JSON.parse(localStorage.getItem('collapsedNodes') || "[]");

            function applySavedState(d) {
                const shouldCollapse = savedCollapsed.length > 0 
                    ? savedCollapsed.includes(d.data.name) 
                    : d.depth >= 1; 

                if (d.children) {
                    d.children.forEach(applySavedState);
                    if (shouldCollapse) {
                        d._children = d.children;
                        d.children = null;
                    }
                }
            }

            applySavedState(root);
            
            // SPEED OPTIMIZATION: Pass 'true' to skip initial sliding animations
            update(root, true);
        }).catch(error => {
            console.error("Error loading the data.json file:", error);
        });

        // 6. The Core Update & Rendering Function (Accepts speed optimizer flag)
        function update(source, isInitialLoad = false) {
            // Drop transitions to 0ms on first boot so it loads instantly
            const transitionDuration = isInitialLoad ? 0 : 400;

            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            // Set generation horizontal branch depths cleanly
            nodes.forEach(d => d.y = d.depth * 260);

            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = Math.random().toString(36)));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                // Force positioning directly if loading initially to skip the sliding animation
                .attr('transform', d => isInitialLoad ? `translate(${d.y},${d.x})` : `translate(${source.y0},${source.x0})`)
                .on('click', (event, d) => {
                    if (d.children) {
                        d._children = d.children;
                        d.children = null;
                    } else {
                        d.children = d._children;
                        d._children = null;
                    }
                    
                    const collapsedNames = [];
                    root.descendants().forEach(node => {
                        if (node._children) {
                            collapsedNames.push(node.data.name);
                        }
                    });
                    localStorage.setItem('collapsedNodes', JSON.stringify(collapsedNames));
                    
                    update(d); // Active user clicks keep their smooth transitions
                });

            nodeEnter.append('circle')
                .attr('class', 'node')
                .attr('r', 6)
                .style("fill", d => d._children ? "#4b6cb7" : "#fff");

            nodeEnter.append('text')
                .attr("dy", "-4")
                .attr("x", d => d.children || d._children ? -15 : 15)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name)
                .style("font-weight", "bold");

            nodeEnter.append('text')
                .attr("class", "spouse-text")
                .attr("dy", "12")
                .attr("x", d => d.children || d._children ? -15 : 15)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => {
                    const spouse = d.data.spouse;
                    const ex = d.data.exSpouse;
                    
                    if (spouse && ex) {
                        return `& ${spouse} (ex: ${ex})`; 
                    } else if (ex && !spouse) {
                        return `(ex: ${ex})`; 
                    } else if (spouse) {
                        return `& ${spouse}`; 
                    }
                    return "";
                });

            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition()
                .duration(transitionDuration)
                .attr('transform', d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle.node')
                .attr('r', 6)
                .style("fill", d => d._children ? "#4b6cb7" : "#fff");

            const nodeExit = node.exit().transition()
                .duration(transitionDuration)
                .attr('transform', d => `translate(${source.y},${source.x})`)
                .remove();

            const link = g.selectAll('path.link')
                .data(links, d => d.target.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr('class', 'link')
                .attr('d', d => {
                    const o = isInitialLoad ? {x: d.target.x, y: d.target.y} : {x: source.x0, y: source.y0};
                    return diagonalCurve(o, o);
                });

            const linkUpdate = linkEnter.merge(link);
            linkUpdate.transition()
                .duration(transitionDuration)
                .attr('d', d => diagonalCurve(d.source, d.target));

            link.exit().transition()
                .duration(transitionDuration)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonalCurve(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        function diagonalCurve(s, d) {
            return `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`;
        }
    </script>
</body>
</html>
